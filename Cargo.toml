[package]
name = "exyex"
version = "0.1.7"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
notify = "9.0.0"
open = "5.4.5"
regex = "1.13.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.4.0"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_Security"] }
winreg = "0.56.0"
similar = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1.34"
